<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400;1,600&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#17142e; --plum:#2c1f55; --blush:#ffb9c9; --marigold:#ffcf5c; --cream:#fff4e2; --ink:#2a2147;
    --serif:"Fraunces",Georgia,serif; --sans:"Nunito","Trebuchet MS",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{font-family:var(--sans);color:var(--cream);background:radial-gradient(ellipse at 50% 110%,var(--plum),var(--night) 70%);
    -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);text-align:center}
  [hidden]{display:none!important}

  /* ---- Stage 1: balloons ---- */
  #counter{position:absolute;top:calc(env(safe-area-inset-top) + 18px);left:0;right:0;font-family:var(--serif);font-size:1.3rem}
  #counter small{display:block;font:500 .95rem var(--sans);opacity:.7;margin-top:4px;transition:opacity .6s}
  .balloon{position:absolute;bottom:-170px;width:88px;height:108px;background:var(--c);
    border-radius:50% 50% 48% 48%/56% 56% 44% 44%;display:flex;align-items:center;justify-content:center;
    font:600 28px var(--serif);color:rgba(255,255,255,.92);cursor:pointer;user-select:none;
    animation:rise 7s linear forwards;box-shadow:inset -10px -12px 0 rgba(0,0,0,.12)}
  .balloon::before{content:"";position:absolute;left:18%;top:14%;width:15%;height:22%;border-radius:50%;background:rgba(255,255,255,.4)}
  .balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:70px;background:rgba(255,255,255,.45)}
  .balloon.gone{animation:pop .22s ease-out forwards}
  @keyframes rise{
    0%{transform:translate(0,0) rotate(-3deg)}
    25%{transform:translate(18px,calc((-100dvh - 280px)*.25)) rotate(3deg)}
    50%{transform:translate(-18px,calc((-100dvh - 280px)*.5)) rotate(-3deg)}
    75%{transform:translate(18px,calc((-100dvh - 280px)*.75)) rotate(3deg)}
    100%{transform:translate(0,calc(-100dvh - 280px)) rotate(0)}}
  @keyframes pop{to{transform:scale(1.7);opacity:0}}
  canvas{position:fixed;inset:0;pointer-events:none;z-index:20}

  /* ---- Stage 2: egg ---- */
  #hb{font:italic 600 clamp(1.9rem,8vw,2.6rem)/1.15 var(--serif);margin:0 0 30px;color:var(--blush);
    opacity:0;transform:translateY(14px);transition:opacity 1s,transform 1s}
  #hb.in{opacity:1;transform:none}
  .egg-wrap{position:relative;width:min(58vw,240px);aspect-ratio:4/5;opacity:0}
  .egg-wrap.drop{animation:drop .9s cubic-bezier(.3,1.4,.5,1) forwards}
  .egg-wrap.wobble{animation:wobble .5s ease-in-out 4}
  @keyframes drop{from{opacity:1;transform:translateY(-90dvh)}to{opacity:1;transform:none}}
  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
  .egg-wrap.drop,.egg-wrap.wobble,.egg-wrap.open{opacity:1}
  .egg,.shell,.egg-photo{position:absolute;inset:0;border-radius:50% 50% 50% 50%/62% 62% 38% 38%}
  .glow{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,207,92,.55),transparent 65%);opacity:0;transition:opacity 1.2s}
  .open .glow{opacity:1}
  .egg-photo{background:var(--blush) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:72px;
    border:5px solid var(--marigold);transform:scale(.88);transition:transform 1s cubic-bezier(.2,1.5,.4,1) .15s;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .open .egg-photo{transform:scale(1.06)}
  .shell{background:
      radial-gradient(circle at 30% 25%,rgba(255,255,255,.7),transparent 35%),
      radial-gradient(circle at 70% 70%,rgba(190,130,80,.25) 0 3%,transparent 4%),
      radial-gradient(circle at 25% 65%,rgba(190,130,80,.25) 0 2.5%,transparent 3.5%),
      var(--cream);
    box-shadow:inset -12px -14px 0 rgba(120,80,50,.12);transition:transform 1s cubic-bezier(.5,0,.3,1),opacity 1s}
  .shell.top{clip-path:polygon(0 0,100% 0,100% 48%,88% 54%,75% 46%,62% 55%,50% 46%,38% 55%,25% 46%,12% 54%,0 48%)}
  .shell.bot{clip-path:polygon(0 48%,12% 54%,25% 46%,38% 55%,50% 46%,62% 55%,75% 46%,88% 54%,100% 48%,100% 100%,0 100%)}
  .open .shell.top{transform:translate(-55%,-120%) rotate(-38deg);opacity:0}
  .open .shell.bot{transform:translate(40%,110%) rotate(26deg);opacity:0}
  .crack{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .crack polyline{fill:none;stroke:#5b3b2a;stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:130;stroke-dashoffset:130}
  .cracked .crack polyline{animation:draw .7s ease-out forwards}
  .open .crack{opacity:0}
  @keyframes draw{to{stroke-dashoffset:0}}
  .cta{margin-top:44px;font:700 1.05rem var(--sans);color:var(--ink);background:var(--marigold);border:0;border-radius:999px;
    padding:15px 28px;box-shadow:0 5px 0 #c99a1f;cursor:pointer;animation:fade 1s both}
  .cta:active{transform:translateY(3px);box-shadow:0 2px 0 #c99a1f}
  .cta:focus-visible,#mute:focus-visible{outline:3px solid var(--blush);outline-offset:3px}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---- Stage 3: luck ---- */
  #luck{padding:0;justify-content:stretch;align-items:stretch;background:var(--night)}
  .lk-img{flex:1 1 50%;background:var(--blush) center 20%/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:90px;
    animation:fromTop 1.2s cubic-bezier(.2,.8,.2,1) both}
  .lk-msg{flex:1 1 50%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 24px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,var(--plum),var(--night));animation:fromBottom 1.2s cubic-bezier(.2,.8,.2,1) both;position:relative}
  .lk-msg::before{content:"";position:absolute;top:-1px;left:0;right:0;height:5px;background:var(--marigold)}
  .lk-msg h2{font:italic 600 clamp(1.5rem,6vw,2rem)/1.2 var(--serif);color:var(--marigold);margin:0 0 14px}
  .lk-msg p{font:400 clamp(1.02rem,4vw,1.25rem)/1.6 var(--serif);margin:0;max-width:30ch;opacity:0;animation:fade 1.2s 1.1s both}
  .lk-msg .from{margin-top:18px;font:italic 400 1.05rem var(--serif);color:var(--blush);opacity:0;animation:fade 1s 1.8s both}
  @keyframes fromTop{from{transform:translateY(-100%)}}
  @keyframes fromBottom{from{transform:translateY(100%)}}

  .player{width:min(100%,380px);margin-top:20px;opacity:0;animation:fade 1s 2.4s both}
  .player iframe{border:0;border-radius:12px;display:block;width:100%}
  .player-note{margin:8px 0 0;font:500 .8rem var(--sans);opacity:.6}
  .luck-line{margin:28px 0 0;font:italic 600 1.4rem/1.3 var(--serif);color:var(--marigold);opacity:0;transition:opacity 1.2s}
  .luck-line.in{opacity:1}
  .luck-line + .cta{margin-top:24px}
  #luck{max-width:520px;left:50%;right:auto;width:100%;transform:translateX(-50%)}
  .lk-img{flex:0 0 42%;background-position:50% 60%}
  .lk-msg{flex:1 1 58%;min-height:0;justify-content:flex-start;padding:0 0 calc(10px + env(safe-area-inset-bottom))}
  .lk-scroll{flex:1;min-height:0;overflow-y:auto;width:100%;padding:22px 26px 34px;text-align:left;-webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(#000 calc(100% - 30px),transparent);mask-image:linear-gradient(#000 calc(100% - 30px),transparent)}
  .lk-scroll h2{text-align:center;margin:0 0 14px}
  .lk-scroll p{font:400 clamp(.98rem,3.9vw,1.12rem)/1.65 var(--serif);max-width:none;margin:0 0 14px;opacity:0;animation:fade 1s both}
  .lk-scroll p.final{font-style:italic;color:var(--blush)}
  .lk-scroll .from{display:block;text-align:right;opacity:0;animation:fade 1s both}
  .lk-msg .player{flex:none;margin:0 auto;padding:0 18px;width:100%;max-width:420px;animation-delay:3.2s}
  .lk-msg .player .player-note{max-width:none;margin:6px 0 0;font:500 .78rem var(--sans);opacity:.6;animation:none;text-align:center}
  #mute{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:14px;z-index:30;width:42px;height:42px;border-radius:50%;
    border:0;background:rgba(255,255,255,.16);color:#fff;font-size:18px;cursor:pointer}
  @media (prefers-reduced-motion:reduce){.balloon{animation-duration:14s!important}}
</style>
</head>
<body>

<section id="balloons" class="stage">
  <div id="counter">0 / 23<small id="hint">Touch the balloon to pop it</small></div>
</section>

<section id="eggStage" class="stage" hidden>
  <h1 id="hb"></h1>
  <div class="egg-wrap" id="egg">
    <div class="glow"></div>
    <div class="egg-photo" id="eggPhoto">🎂</div>
    <div class="shell top"></div><div class="shell bot"></div>
    <svg class="crack" viewBox="0 0 100 125" aria-hidden="true"><polyline points="0,60 12,67.5 25,57.5 38,68.75 50,57.5 62,68.75 75,57.5 88,67.5 100,60"/></svg>
  </div>
  <p class="luck-line" id="luckLine"></p>
  <button class="cta" id="claim" hidden>Claim your birthday luck</button>
</section>

<section id="luck" class="stage" hidden>
  <div class="lk-img" id="lkImg">🎁</div>
  <div class="lk-msg">
    <div class="lk-scroll" id="lkScroll"></div>
    <div class="player"><div id="playerHost"></div><p class="player-note">Tap play if the song doesn't start by itself</p></div>
  </div>
</section>

<button id="mute" hidden aria-label="Mute music">🔊</button>
<canvas id="confetti"></canvas>

<script>
/* ============ EDIT THESE ============ */
const NAME       = "Atharsh";
const PHOTO      = "photo.jpg";       // comes out of the egg
const LUCK_PHOTO = "luck.jpg";        // top half of the final page
const LUCK_LINE  = "Ennai paarthal yogam varum.";   // shown under the egg picture
const FROM       = "Vikashini";
const SPOTIFY_ID = "3wzbhabVCbaDfElh0S57Yg";        // song for the final page
const TOTAL      = 23;                // number of balloons

const MESSAGE_TITLE = "Happy birthday 🩷";
const MESSAGE = [
  "You’re my hot bowl of rasam rice with extra spicy potato, my purple mink blanket that I’m never gonna replace and my OK Kanmani playlist that my Instagram would first suggest for every picture that I try to post. Comfortable but something that I’d never get enough of or get bored of.",
  "Thanks for being my safe space, my functional secondary brain (better than my primary at times), my consistent source of comfort and my biggest problem that I have no problem having.",
  "And most importantly, this celebration does not end today, as long as I exist you will be celebrated."
];
/* ==================================== */

const $ = id => document.getElementById(id);
const colors = ["#ff6f91","#ffcf5c","#4cc9f0","#7bd389","#b388ff","#ff8a5b"];

function setPhoto(el, src){
  const i = new Image();
  i.onload = () => { el.style.backgroundImage = `url("${src}")`; el.textContent = ""; };
  i.src = src;
}
setPhoto($("eggPhoto"), PHOTO);
setPhoto($("lkImg"), LUCK_PHOTO);
$("hb").textContent = `Happy Birthday, ${NAME}!`;
$("luckLine").textContent = LUCK_LINE;
(function buildMessage(){
  const box = $("lkScroll");
  const h = document.createElement("h2"); h.textContent = MESSAGE_TITLE; box.appendChild(h);
  MESSAGE.forEach((t,i) => {
    const p = document.createElement("p"); p.textContent = t;
    if(i === MESSAGE.length-1) p.className = "final";
    p.style.animationDelay = (1.1 + i*1.1) + "s"; box.appendChild(p);
  });
  const f = document.createElement("span"); f.className = "from"; f.textContent = "with love, " + FROM;
  f.style.animationDelay = (1.1 + MESSAGE.length*1.1) + "s"; box.appendChild(f);
})();

function show(id){ ["balloons","eggStage","luck"].forEach(s => $(s).hidden = (s !== id)); }

/* ---------- Sound ---------- */
let ac, muted = false, timer, playing = false;
function audio(){ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); return ac; }
function tone(f,t,d,vol=.16,type="triangle"){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+.05);
}
function blip(){ if(!ac||muted) return; tone(500+Math.random()*600, ac.currentTime, .13, .12, "sine"); }
const N = {C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,Bb4:466.16,C5:523.25};
const song = [["C4",.75],["C4",.25],["D4",1],["C4",1],["F4",1],["E4",2],
  ["C4",.75],["C4",.25],["D4",1],["C4",1],["G4",1],["F4",2],
  ["C4",.75],["C4",.25],["C5",1],["A4",1],["F4",1],["E4",1],["D4",2],
  ["Bb4",.75],["Bb4",.25],["A4",1],["F4",1],["G4",1],["F4",2]];
function playSong(){
  if(!playing) return;
  const beat = .46; let t = ac.currentTime + .05, total = 0;
  song.forEach(([n,b]) => { if(!muted) tone(N[n],t,b*beat*.95); t += b*beat; total += b*beat; });
  timer = setTimeout(playSong, (total+.8)*1000);
}
function startMusic(){ audio(); playing = true; playSong(); $("mute").hidden = false; }
$("mute").onclick = () => { muted = !muted; $("mute").textContent = muted ? "🔇" : "🔊"; };

/* ---------- Confetti ---------- */
const cv = $("confetti"), cx = cv.getContext("2d"); let bits = [], running = false;
function fit(){ cv.width = innerWidth; cv.height = innerHeight; } fit(); addEventListener("resize", fit);
function burst(x, y, n=40){
  for(let i=0;i<n;i++) bits.push({x,y,vx:(Math.random()-.5)*10,vy:Math.random()*-10-2,s:4+Math.random()*5,
    c:colors[i%colors.length],a:1,r:Math.random()*6});
  if(!running){ running = true; tick(); }
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits = bits.filter(p => p.a > .02);
  bits.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.a-=.014; p.r+=.2;
    cx.save(); cx.globalAlpha=p.a; cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cx.restore(); });
  if(bits.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0,0,cv.width,cv.height); }
}

/* ---------- Stage 1: 23 balloons, one at a time ---------- */
let popped = 0;
function spawn(){
  const b = document.createElement("div");
  b.className = "balloon";
  b.textContent = popped + 1;
  b.style.left = (8 + Math.random() * (innerWidth - 104)) + "px";
  b.style.setProperty("--c", colors[popped % colors.length]);
  b.style.animationDuration = (6.5 + Math.random()*1.5) + "s";
  b.addEventListener("pointerdown", e => { e.preventDefault(); pop(b); });
  b.addEventListener("animationend", e => {
    if(e.animationName === "rise"){ b.remove(); spawn(); }   // missed it: send a fresh one
  });
  $("balloons").appendChild(b);
}
function pop(b){
  if(b.classList.contains("gone")) return;
  audio(); blip();
  const r = b.getBoundingClientRect();
  b.classList.add("gone");
  burst(r.left + r.width/2, r.top + r.height/2, 26);
  setTimeout(() => b.remove(), 240);
  popped++;
  $("counter").firstChild.textContent = `${popped} / ${TOTAL}`;
  $("hint").style.opacity = 0;
  if(popped >= TOTAL) setTimeout(eggScene, 700);
  else setTimeout(spawn, 350);
}
spawn();

/* ---------- Stage 2: egg ---------- */
function eggScene(){
  show("eggStage");
  const egg = $("egg");
  setTimeout(() => $("hb").classList.add("in"), 200);
  setTimeout(() => egg.classList.add("drop"), 900);
  setTimeout(() => { egg.classList.remove("drop"); egg.classList.add("wobble"); }, 1900);
  setTimeout(() => egg.classList.add("cracked"), 2400);
  setTimeout(() => {
    egg.classList.remove("wobble"); egg.classList.add("open","cracked");
    burst(innerWidth/2, innerHeight/2, 90);
    startMusic();
  }, 3900);
  setTimeout(() => $("luckLine").classList.add("in"), 4800);
  setTimeout(() => { $("claim").hidden = false; }, 6400);
}

/* ---------- Stage 3: luck ---------- */
let spotifyApi = null;
window.onSpotifyIframeApiReady = api => { spotifyApi = api; };

function startSpotify(){
  const host = $("playerHost");
  if(spotifyApi){
    spotifyApi.createController(host, {uri:`spotify:track:${SPOTIFY_ID}`, width:"100%", height:80}, c => {
      c.addListener("ready", () => c.play());
    });
  } else {
    host.innerHTML = `<iframe src="https://open.spotify.com/embed/track/${SPOTIFY_ID}?utm_source=generator" height="80" allow="autoplay; encrypted-media; clipboard-write" loading="eager"></iframe>`;
  }
}

$("claim").onclick = () => {
  playing = false; clearTimeout(timer); $("mute").hidden = true;   // stop the synth tune
  show("luck"); burst(innerWidth/2, innerHeight/2, 120);
  startSpotify();
};
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
